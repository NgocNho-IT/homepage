<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7057e8" />
  <title>Danh sách việc cần làm</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css"
  />

  <style>
    :root {
      --bg: #f5f4ff;
      --surface: rgba(255, 255, 255, 0.84);
      --surface-solid: #ffffff;
      --text: #19172c;
      --muted: #77738d;
      --border: rgba(97, 78, 180, 0.12);
      --primary: #7057e8;
      --primary-dark: #5940cf;
      --secondary: #9f8cff;
      --success: #21a675;
      --danger: #e05268;
      --warning: #f4a340;
      --shadow: 0 24px 70px rgba(59, 42, 130, 0.14);
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 13px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
        system-ui, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 15%, rgba(159, 140, 255, 0.28), transparent 28%),
        radial-gradient(circle at 88% 80%, rgba(112, 87, 232, 0.18), transparent 31%),
        linear-gradient(135deg, #f8f7ff 0%, #f2f0ff 48%, #f8fbff 100%);
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
    }

    .decor {
      position: fixed;
      z-index: -1;
      border-radius: 999px;
      filter: blur(4px);
      opacity: 0.7;
      animation: float 8s ease-in-out infinite;
    }

    .decor.one {
      top: 9%;
      left: 4%;
      width: 110px;
      height: 110px;
      background: linear-gradient(135deg, #d7ceff, #b9a9ff);
    }

    .decor.two {
      right: 5%;
      bottom: 10%;
      width: 150px;
      height: 150px;
      background: linear-gradient(135deg, #dce7ff, #c7baff);
      animation-delay: -3s;
    }

    .app-shell {
      width: min(100% - 32px, 860px);
      margin: 0 auto;
      padding: 58px 0 72px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-end;
      margin-bottom: 22px;
      animation: fadeUp 0.65s ease both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--primary-dark);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }

    h1 {
      max-width: 620px;
      font-size: clamp(2.1rem, 6vw, 4.1rem);
      line-height: 1.02;
      letter-spacing: -0.055em;
    }

    .gradient-text {
      background: linear-gradient(120deg, var(--primary-dark), #9b6df5 72%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin-top: 13px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
    }

    .date-card {
      flex: 0 0 auto;
      padding: 14px 18px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.62);
      box-shadow: 0 12px 40px rgba(76, 55, 151, 0.08);
      backdrop-filter: blur(14px);
      text-align: right;
    }

    .date-card strong,
    .date-card span {
      display: block;
    }

    .date-card strong {
      font-size: 1rem;
    }

    .date-card span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .panel {
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      animation: fadeUp 0.75s 0.08s ease both;
    }

    .composer {
      padding: 24px;
      background: linear-gradient(135deg, rgba(112, 87, 232, 0.98), rgba(143, 113, 239, 0.93));
    }

    .input-wrap {
      display: flex;
      gap: 12px;
      padding: 8px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 14px 28px rgba(51, 30, 137, 0.2);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .input-wrap:focus-within {
      transform: translateY(-2px);
      box-shadow: 0 18px 34px rgba(51, 30, 137, 0.27);
    }

    #taskInput {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      padding: 12px 14px;
      color: var(--text);
      background: transparent;
      font-size: 1rem;
      font-weight: 600;
    }

    #taskInput::placeholder {
      color: #aaa5bc;
      font-weight: 500;
    }

    .add-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 128px;
      padding: 0 20px;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(88, 63, 203, 0.28);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .add-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .add-btn:active {
      transform: scale(0.97);
    }

    .add-btn svg {
      width: 18px;
      height: 18px;
    }

    .content {
      padding: 22px 24px 28px;
    }

    .overview {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      margin-bottom: 20px;
    }

    .progress-copy {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 9px;
    }

    .progress-copy strong {
      font-size: 0.95rem;
    }

    .progress-copy span {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .progress-track {
      height: 9px;
      overflow: hidden;
      border-radius: 99px;
      background: #ebe8f7;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), #a582ff);
      transition: width 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .count-badge {
      min-width: 84px;
      padding: 12px 14px;
      border-radius: 16px;
      color: var(--primary-dark);
      background: #f0edff;
      text-align: center;
      font-weight: 800;
    }

    .count-badge small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
    }

    .filters {
      display: flex;
      gap: 8px;
      padding: 5px;
      border-radius: 14px;
      background: #f3f1fa;
    }

    .filter-btn {
      padding: 9px 13px;
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
      font-size: 0.86rem;
      font-weight: 750;
      cursor: pointer;
      transition: 0.22s ease;
    }

    .filter-btn:hover {
      color: var(--primary-dark);
    }

    .filter-btn.active {
      color: #fff;
      background: var(--primary);
      box-shadow: 0 7px 16px rgba(112, 87, 232, 0.24);
    }

    .clear-btn {
      padding: 9px 4px;
      color: var(--danger);
      background: transparent;
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .clear-btn:hover {
      opacity: 0.7;
    }

    .task-list {
      display: grid;
      gap: 12px;
      list-style: none;
    }

    .task-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 15px 15px 15px 17px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 8px 24px rgba(56, 40, 113, 0.06);
      animation: taskIn 0.36s cubic-bezier(0.17, 0.84, 0.44, 1) both;
      transition: transform 0.23s ease, box-shadow 0.23s ease, border-color 0.23s ease;
    }

    .task-item:hover {
      transform: translateY(-2px);
      border-color: rgba(112, 87, 232, 0.23);
      box-shadow: 0 13px 28px rgba(56, 40, 113, 0.1);
    }

    .task-item.removing {
      pointer-events: none;
      animation: taskOut 0.28s ease forwards;
    }

    .check-btn {
      display: grid;
      width: 25px;
      height: 25px;
      place-items: center;
      border: 2px solid #c8c2dc;
      border-radius: 9px;
      color: transparent;
      background: #fff;
      cursor: pointer;
      transition: 0.22s ease;
    }

    .check-btn:hover {
      border-color: var(--primary);
      transform: scale(1.06);
    }

    .check-btn svg {
      width: 15px;
      height: 15px;
      stroke-width: 3;
    }

    .task-main {
      min-width: 0;
    }

    .task-title {
      overflow-wrap: anywhere;
      font-weight: 720;
      line-height: 1.45;
      transition: color 0.2s ease;
    }

    .task-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 550;
    }

    .task-item.completed {
      background: rgba(249, 248, 253, 0.72);
    }

    .task-item.completed .check-btn {
      color: #fff;
      border-color: var(--success);
      background: var(--success);
      transform: rotate(-2deg);
    }

    .task-item.completed .task-title {
      color: #9a96a9;
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      text-decoration-color: rgba(112, 87, 232, 0.38);
    }

    .actions {
      display: flex;
      gap: 7px;
    }

    .icon-btn {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 11px;
      color: var(--muted);
      background: #f4f2fa;
      cursor: pointer;
      transition: transform 0.2s ease, color 0.2s ease, background 0.2s ease;
    }

    .icon-btn:hover {
      transform: translateY(-2px);
    }

    .icon-btn.edit:hover {
      color: var(--primary-dark);
      background: #ece8ff;
    }

    .icon-btn.delete:hover {
      color: var(--danger);
      background: #fff0f3;
    }

    .icon-btn svg {
      width: 17px;
      height: 17px;
      stroke-width: 2;
    }

    .edit-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .edit-input {
      min-width: 0;
      flex: 1;
      padding: 9px 11px;
      border: 1px solid rgba(112, 87, 232, 0.35);
      border-radius: 10px;
      outline: 0;
      color: var(--text);
      background: #fff;
      font-weight: 650;
      box-shadow: 0 0 0 3px rgba(112, 87, 232, 0.08);
    }

    .save-edit,
    .cancel-edit {
      padding: 9px 11px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
    }

    .save-edit {
      color: #fff;
      background: var(--primary);
    }

    .cancel-edit {
      color: var(--muted);
      background: #efedf5;
    }

    .empty-state {
      display: none;
      padding: 42px 18px 34px;
      text-align: center;
      animation: fadeUp 0.4s ease both;
    }

    .empty-state.show {
      display: block;
    }

    .empty-icon {
      display: grid;
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      place-items: center;
      border-radius: 22px;
      color: var(--primary);
      background: linear-gradient(135deg, #eeeaff, #f6f4ff);
      transform: rotate(-4deg);
    }

    .empty-icon svg {
      width: 31px;
      height: 31px;
    }

    .empty-state h2 {
      font-size: 1.12rem;
    }

    .empty-state p {
      max-width: 380px;
      margin: 7px auto 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.9rem;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 20;
      display: flex;
      gap: 10px;
      align-items: center;
      min-width: min(92vw, 320px);
      padding: 13px 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 15px;
      color: #fff;
      background: rgba(30, 27, 47, 0.94);
      box-shadow: 0 16px 36px rgba(24, 18, 54, 0.24);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 18px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      backdrop-filter: blur(12px);
      font-size: 0.88rem;
      font-weight: 650;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast svg {
      width: 18px;
      height: 18px;
      color: #a995ff;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes taskIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes taskOut {
      to {
        opacity: 0;
        transform: translateX(26px) scale(0.96);
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-18px) rotate(5deg); }
    }

    @media (max-width: 680px) {
      .app-shell {
        width: min(100% - 20px, 860px);
        padding-top: 34px;
      }

      .hero {
        display: block;
      }

      .date-card {
        display: inline-block;
        margin-top: 18px;
        text-align: left;
      }

      .composer,
      .content {
        padding-left: 16px;
        padding-right: 16px;
      }

      .input-wrap {
        gap: 7px;
      }

      .add-btn {
        min-width: 52px;
        padding: 0 15px;
      }

      .add-btn span {
        display: none;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .filters {
        width: 100%;
      }

      .filter-btn {
        flex: 1;
      }

      .clear-btn {
        align-self: flex-end;
      }

      .task-item {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .actions {
        grid-column: 2;
        justify-content: flex-end;
      }

      .edit-row {
        flex-wrap: wrap;
      }

      .edit-input {
        flex-basis: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="decor one" aria-hidden="true"></div>
  <div class="decor two" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Daily Focus</p>
        <h1>Làm chủ ngày mới bằng <span class="gradient-text">những việc nhỏ.</span></h1>
        <p class="subtitle">Ghi lại, hoàn thành và theo dõi tiến độ công việc của bạn mỗi ngày.</p>
      </div>

      <div class="date-card" aria-label="Ngày hiện tại">
        <strong id="currentDay">Hôm nay</strong>
        <span id="currentDate"></span>
      </div>
    </header>

    <section class="panel" aria-label="Ứng dụng quản lý công việc">
      <form class="composer" id="taskForm" autocomplete="off">
        <div class="input-wrap">
          <input
            id="taskInput"
            type="text"
            maxlength="120"
            placeholder="Bạn cần làm gì hôm nay?"
            aria-label="Tên công việc"
          />
          <button class="add-btn" type="submit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <path d="M12 5v14M5 12h14" stroke-linecap="round" />
            </svg>
            <span>Thêm việc</span>
          </button>
        </div>
      </form>

      <div class="content">
        <div class="overview">
          <div>
            <div class="progress-copy">
              <strong>Tiến độ hôm nay</strong>
              <span id="progressText">0% hoàn thành</span>
            </div>
            <div class="progress-track" aria-hidden="true">
              <div class="progress-bar" id="progressBar"></div>
            </div>
          </div>
          <div class="count-badge">
            <span id="taskCount">0/0</span>
            <small>đã xong</small>
          </div>
        </div>

        <div class="toolbar">
          <div class="filters" aria-label="Bộ lọc công việc">
            <button class="filter-btn active" type="button" data-filter="all">Tất cả</button>
            <button class="filter-btn" type="button" data-filter="active">Đang làm</button>
            <button class="filter-btn" type="button" data-filter="completed">Hoàn thành</button>
          </div>
          <button class="clear-btn" id="clearCompleted" type="button">Xóa việc đã xong</button>
        </div>

        <ul class="task-list" id="taskList" aria-live="polite"></ul>

        <div class="empty-state" id="emptyState">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <path d="M9 11l3 3L22 4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
            </svg>
          </div>
          <h2 id="emptyTitle">Chưa có công việc nào</h2>
          <p id="emptyMessage">Hãy thêm công việc đầu tiên để bắt đầu một ngày thật hiệu quả.</p>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
      <path d="M20 6 9 17l-5-5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
    </svg>
    <span id="toastMessage"></span>
  </div>

  <script>
    const STORAGE_KEY = "modern_todo_tasks_v1";

    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const emptyState = document.getElementById("emptyState");
    const emptyTitle = document.getElementById("emptyTitle");
    const emptyMessage = document.getElementById("emptyMessage");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const taskCount = document.getElementById("taskCount");
    const clearCompletedButton = document.getElementById("clearCompleted");
    const filterButtons = document.querySelectorAll(".filter-btn");
    const toast = document.getElementById("toast");
    const toastMessage = document.getElementById("toastMessage");

    let tasks = loadTasks();
    let currentFilter = "all";
    let editingId = null;
    let toastTimer;

    function loadTasks() {
      try {
        const savedTasks = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(savedTasks) ? savedTasks : [];
      } catch (error) {
        console.warn("Không thể đọc dữ liệu công việc:", error);
        return [];
      }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function createId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function escapeHTML(value) {
      const div = document.createElement("div");
      div.textContent = value;
      return div.innerHTML;
    }

    function formatCreatedAt(timestamp) {
      return new Intl.DateTimeFormat("vi-VN", {
        hour: "2-digit",
        minute: "2-digit",
        day: "2-digit",
        month: "2-digit"
      }).format(new Date(timestamp));
    }

    function getFilteredTasks() {
      if (currentFilter === "active") return tasks.filter((task) => !task.completed);
      if (currentFilter === "completed") return tasks.filter((task) => task.completed);
      return tasks;
    }

    function renderTasks() {
      const filteredTasks = getFilteredTasks();

      taskList.innerHTML = filteredTasks
        .map((task) => {
          const isEditing = task.id === editingId;

          return `
            <li class="task-item ${task.completed ? "completed" : ""}" data-id="${task.id}">
              <button
                class="check-btn"
                type="button"
                data-action="toggle"
                aria-label="${task.completed ? "Đánh dấu chưa hoàn thành" : "Đánh dấu hoàn thành"}"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                  <path d="M5 12.5 9.5 17 19 7" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>

              <div class="task-main">
                ${
                  isEditing
                    ? `
                      <div class="edit-row">
                        <input class="edit-input" type="text" maxlength="120" value="${escapeHTML(task.title)}" aria-label="Chỉnh sửa công việc" />
                        <button class="save-edit" type="button" data-action="save">Lưu</button>
                        <button class="cancel-edit" type="button" data-action="cancel">Hủy</button>
                      </div>
                    `
                    : `
                      <p class="task-title">${escapeHTML(task.title)}</p>
                      <p class="task-meta">Đã tạo lúc ${formatCreatedAt(task.createdAt)}</p>
                    `
                }
              </div>

              <div class="actions" ${isEditing ? 'style="display:none"' : ""}>
                <button class="icon-btn edit" type="button" data-action="edit" aria-label="Chỉnh sửa công việc">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                    <path d="M12 20h9" stroke-linecap="round" />
                    <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </button>
                <button class="icon-btn delete" type="button" data-action="delete" aria-label="Xóa công việc">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                    <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M10 11v5M14 11v5" stroke-linecap="round" />
                  </svg>
                </button>
              </div>
            </li>
          `;
        })
        .join("");

      renderEmptyState(filteredTasks.length);
      updateOverview();

      if (editingId) {
        requestAnimationFrame(() => {
          const input = document.querySelector(`[data-id="${editingId}"] .edit-input`);
          if (input) {
            input.focus();
            input.select();
          }
        });
      }
    }

    function renderEmptyState(filteredCount) {
      const isEmpty = filteredCount === 0;
      emptyState.classList.toggle("show", isEmpty);

      if (!isEmpty) return;

      const messages = {
        all: ["Chưa có công việc nào", "Hãy thêm công việc đầu tiên để bắt đầu một ngày thật hiệu quả."],
        active: ["Không còn việc đang làm", "Tuyệt vời! Bạn đã hoàn thành tất cả công việc hiện tại."],
        completed: ["Chưa có việc hoàn thành", "Hoàn thành một công việc và nó sẽ xuất hiện tại đây."]
      };

      [emptyTitle.textContent, emptyMessage.textContent] = messages[currentFilter];
    }

    function updateOverview() {
      const total = tasks.length;
      const completed = tasks.filter((task) => task.completed).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

      progressBar.style.width = `${percent}%`;
      progressText.textContent = `${percent}% hoàn thành`;
      taskCount.textContent = `${completed}/${total}`;
      clearCompletedButton.hidden = completed === 0;
    }

    function addTask(title) {
      const cleanTitle = title.trim();
      if (!cleanTitle) {
        showToast("Vui lòng nhập nội dung công việc.");
        taskInput.focus();
        return;
      }

      tasks.unshift({
        id: createId(),
        title: cleanTitle,
        completed: false,
        createdAt: Date.now()
      });

      saveTasks();
      renderTasks();
      taskInput.value = "";
      taskInput.focus();
      showToast("Đã thêm công việc mới.");
    }

    function toggleTask(id) {
      tasks = tasks.map((task) =>
        task.id === id ? { ...task, completed: !task.completed } : task
      );
      saveTasks();
      renderTasks();
    }

    function deleteTask(id, element) {
      element.classList.add("removing");
      setTimeout(() => {
        tasks = tasks.filter((task) => task.id !== id);
        if (editingId === id) editingId = null;
        saveTasks();
        renderTasks();
        showToast("Đã xóa công việc.");
      }, 260);
    }

    function startEditing(id) {
      editingId = id;
      renderTasks();
    }

    function saveEdit(id, input) {
      const newTitle = input.value.trim();
      if (!newTitle) {
        showToast("Tên công việc không được để trống.");
        input.focus();
        return;
      }

      tasks = tasks.map((task) =>
        task.id === id ? { ...task, title: newTitle } : task
      );
      editingId = null;
      saveTasks();
      renderTasks();
      showToast("Đã cập nhật công việc.");
    }

    function cancelEditing() {
      editingId = null;
      renderTasks();
    }

    function setFilter(filter) {
      currentFilter = filter;
      editingId = null;
      filterButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.filter === filter);
      });
      renderTasks();
    }

    function clearCompleted() {
      const completedCount = tasks.filter((task) => task.completed).length;
      if (completedCount === 0) return;

      tasks = tasks.filter((task) => !task.completed);
      editingId = null;
      saveTasks();
      renderTasks();
      showToast(`Đã xóa ${completedCount} công việc hoàn thành.`);
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toastMessage.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function showCurrentDate() {
      const now = new Date();
      document.getElementById("currentDay").textContent = new Intl.DateTimeFormat("vi-VN", {
        weekday: "long"
      }).format(now);
      document.getElementById("currentDate").textContent = new Intl.DateTimeFormat("vi-VN", {
        day: "2-digit",
        month: "long",
        year: "numeric"
      }).format(now);
    }

    taskForm.addEventListener("submit", (event) => {
      event.preventDefault();
      addTask(taskInput.value);
    });

    taskList.addEventListener("click", (event) => {
      const actionButton = event.target.closest("[data-action]");
      const taskItem = event.target.closest(".task-item");
      if (!actionButton || !taskItem) return;

      const id = taskItem.dataset.id;
      const action = actionButton.dataset.action;

      if (action === "toggle") toggleTask(id);
      if (action === "delete") deleteTask(id, taskItem);
      if (action === "edit") startEditing(id);
      if (action === "cancel") cancelEditing();
      if (action === "save") {
        const input = taskItem.querySelector(".edit-input");
        saveEdit(id, input);
      }
    });

    taskList.addEventListener("keydown", (event) => {
      if (!event.target.classList.contains("edit-input")) return;

      const taskItem = event.target.closest(".task-item");
      if (event.key === "Enter") saveEdit(taskItem.dataset.id, event.target);
      if (event.key === "Escape") cancelEditing();
    });

    filterButtons.forEach((button) => {
      button.addEventListener("click", () => setFilter(button.dataset.filter));
    });

    clearCompletedButton.addEventListener("click", clearCompleted);

    showCurrentDate();
    renderTasks();
  </script>
</body>
</html>
